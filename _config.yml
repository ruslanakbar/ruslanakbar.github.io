# ===============================
# Site settings
# ===============================

title: Ruslan Akbar
# The site's public address. Used for the sitemap, canonical links and link previews.
url: "https://ruslanakbar.github.io"
name: Ruslan Akbar
description: >
  PhD student in Mechanical Engineering |
  Computational Modeling |
  CFD • Machine Learning • Uncertainty Quantification

# ===============================
# Theme
# ===============================

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: dark

# ===============================
# Plugins (CRITICAL)
# ===============================

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ===============================
# Author profile (sidebar)
# ===============================

author:
  name: Ruslan Akbar
  avatar: "/assets/images/profile.jpg"
  bio: >
    PhD student in Mechanical Engineering at Louisiana State
    University. Curious about physics, computation, and what
    we can learn from both.
  location: "Baton Rouge, USA"
  employer: "Louisiana State University"
  github: ruslanakbar
  linkedin: ruslanakbarzade

# ===============================
# Identity data for search engines
# ===============================
# Not shown on the site. Tells Google who the site belongs to, other spellings
# of the name, and which profiles elsewhere are the same person
# (see _includes/schema.html). LinkedIn and GitHub come from `author` above.

identity:
  alternate_names:
    - "Ruslan Akbarzade"
  job_title: "PhD student in Mechanical Engineering"
  organization: "Louisiana State University"
  organization_url: "https://www.lsu.edu"
  # Research group. Shown as a link in the details line on the home page.
  lab:
    name: "DMO Lab"
    url: "https://dmo-lab.com/"
  # Other profiles that are you: add full addresses here, for example a
  # Google Scholar or ORCID page.
  profiles: []

# ===============================
# Defaults (page layout)
# ===============================

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide
  # Keep the Google verification file out of the sitemap.
  - scope:
      path: "google808f1dd114fc9d08.html"
    values:
      sitemap: false

# ===============================
# Extras
# ===============================

# Fluid-style trail behind the mouse pointer (assets/js/cursor-wake.js).
# Set to false to switch it off.
cursor_wake: true

# Colormap picker in the bottom-right corner (assets/js/colormap.js).
# Set to false to remove it and keep the default colours.
colormap_switcher: true

# ===============================
# Markdown & syntax highlighting
# ===============================

markdown: kramdown
highlighter: rouge
